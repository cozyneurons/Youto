# Production Docker Compose — Youto
# Uses pre-built GHCR images (pushed by GitHub Actions CI/CD)
# Frontend is served by Netlify
# All secrets (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB) must be set in .env
# Never commit .env — it is gitignored

services:
  # ── Database ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: youto-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - youto-net

  # ── Cache ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: youto-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - youto-net

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/cozyneurons/youto/backend:latest
    container_name: youto-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - youto-net

networks:
  youto-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
